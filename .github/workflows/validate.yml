name: Validate Plugins

on:
  pull_request:
    paths:
      - '.claude-plugin/marketplace.json'
      - '**/SKILL.md'
      - '**/.claude-plugin/plugin.json'
      - '**/references/**'
      - '**/scripts/**'
      - '**/agents/**'
      - '**/hooks/**'
      - '**/plugin.json'

jobs:
  validate:
    uses: ./.github/workflows/reusable-validate.yml
